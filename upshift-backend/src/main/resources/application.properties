# ---- Anthropic (Claude) API ----
# Values come from env vars or the .env file in the working directory.
quarkus.rest-client.ai-api.url=${AI_API_URL:https://api.anthropic.com}
quarkus.rest-client.ai-api.read-timeout=120000
quarkus.rest-client.ai-api.connect-timeout=10000

upshift.ai.api-key=${AI_API_KEY}
upshift.ai.model=${AI_MODEL:claude-sonnet-5}
upshift.ai.max-tokens=8000
%test.upshift.ai.api-key=test-key

# ---- Web search (Anthropic server-side tool, $10 per 1,000 searches + tokens) ----
# enabled=false turns it off entirely; default is used when a request doesn't send "webSearch".
upshift.ai.web-search.enabled=${AI_WEB_SEARCH_ENABLED:true}
upshift.ai.web-search.default=false
upshift.ai.web-search.max-uses=3
# web_search_20250305 = basic search (fastest for short quizzes). web_search_20260318 adds dynamic
# filtering; in testing it was ~3x slower and used more tokens for this workload.
upshift.ai.web-search.tool-version=web_search_20250305

# ---- Quizzes (answer keys kept in memory, never sent to the UI before submit) ----
upshift.quiz.ttl=PT2H
upshift.quiz.max-stored=10000

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
# In dev mode, allow a UI on any localhost / 127.0.0.1 port (Vite, CRA, Live Server, ...)
%dev.quarkus.http.cors.origins=/https?://(localhost|127\\\\.0\\\\.0\\\\.1)(:[0-9]+)?/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Admin-Key

# ---- Admin: PDF upload -> questions ----
# Required: the admin UI sends it in the X-Admin-Key header. Unset = admin API disabled.
upshift.admin.api-key=${ADMIN_API_KEY:}
%test.upshift.admin.api-key=test-admin-key
# Where uploaded PDFs and their extracted text are stored (relative to the working directory).
upshift.admin.storage-dir=${ADMIN_STORAGE_DIR:data/uploads}
%test.upshift.admin.storage-dir=target/test-uploads
upshift.admin.max-upload-bytes=10485760
%test.upshift.admin.max-upload-bytes=500000
upshift.admin.max-pages=300
# Text sent to the AI is capped (~30k tokens); longer PDFs use their first pages.
upshift.admin.max-document-chars=120000
# Slightly above the upload limit so oversized PDFs get our JSON 413 message.
quarkus.http.limits.max-body-size=11M
quarkus.http.body.delete-uploaded-files-on-end=true

# ---- Swagger UI at /q/swagger-ui ----
quarkus.swagger-ui.always-include=true
